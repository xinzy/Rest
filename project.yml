name: XieHuiEr

options:
  bundleIdPrefix: com.shaozeng
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.3"
    CURRENT_PROJECT_VERSION: "4"
    # 仅自用：ad-hoc 签名，不需要开发者账号
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

targets:
  XieHuiEr:
    type: application
    platform: macOS
    sources:
      - path: XieHuiEr
    info:
      path: XieHuiEr/Resources/Info.plist
      properties:
        CFBundleName: 歇会儿
        CFBundleDisplayName: 歇会儿
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shaozeng.xiehuier
        # 应用在 Finder 里显示为「歇会儿.app」；可执行文件和 Swift 模块仍用 ASCII 名
        PRODUCT_NAME: 歇会儿
        EXECUTABLE_NAME: XieHuiEr
        PRODUCT_MODULE_NAME: XieHuiEr
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  XieHuiErTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: XieHuiErTests
    dependencies:
      - target: XieHuiEr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shaozeng.xiehuier.tests
        GENERATE_INFOPLIST_FILE: YES
        # 产品名是「歇会儿.app」，xcodegen 按目标名生成的 TEST_HOST 指不到它
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/歇会儿.app/Contents/MacOS/XieHuiEr
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  XieHuiEr:
    build:
      targets:
        XieHuiEr: all
        XieHuiErTests: [test]
    test:
      targets:
        - XieHuiErTests
